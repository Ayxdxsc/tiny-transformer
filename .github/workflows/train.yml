name: Mac M-Series Extreme Test

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-mac-arm:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 检查环境与芯片信息
        run: |
          sysctl -n machdep.cpu.brand_string
          echo "=== 系统架构 ==="
          uname -m

      - name: 生成训练数据
        run: |
          # 跑你的神仙脚本，生成 calc-data 文件夹
          python3 train.py 
          echo "=== 生成的文件列表 ==="
          ls -lh calc-data/

      - name: 编译 (针对 Apple M1 原生指令集优化)
        run: |
          # 强制使用 apple-m1 目标，开启极速编译
          clang++ -O3 -target arm64-apple-macos11 -mcpu=apple-m1 -ffast-math -fno-math-errno -funroll-loops \
                  -fomit-frame-pointer -fno-exceptions -fno-rtti -pthread \
                  -o tiny_mac tiny.cpp
                  
      - name: 运行训练 (疯狂炼丹模式)
        run: |
          echo "=== 启动 M-Series 炼丹炉 ==="
          # 我们直接跑 50 轮！
          # 如果 train loss 降到了 0.001（几乎全对），它会触发早停，提前收工。
          ./tiny_mac --mode train --data-dir calc-data --sort-by name --data-exts .txt \
                     --model tiny.bin --ckpt model.ckpt --epochs 50 --stop-loss 0.001 \
                     --batch-size 4 --ctx 64 --D 64 --L 2 --train-threads 4
      - name: 测试推理结果
        run: |
          echo "=== 抽考：测试刚炼出来的模型 ==="
          ./tiny_mac --mode gen --model tiny.bin -p "12+34=" --greedy
          ./tiny_mac --mode gen --model tiny.bin -p "8*9=" --greedy

      - name: 上传模型文件 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: tiny-model-m1
          path: |
            tiny.bin
            model.ckpt
          retention-days: 5
