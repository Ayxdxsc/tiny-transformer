name: Train Mod 97 Grokking
on: [push]
jobs:
  train:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v3
      - name: Compile and Run
        run: |
          clang++ -O3 -flto -mcpu=apple-m1 -ffast-math -funroll-loops -pthread -o tiny tiny.cpp
          # 跑 2 万步看结果，存下日志和权重
          ./tiny --mode train \
            --data train.txt --val-data test.txt \
            --model mod97.bin --ckpt mod97.ckpt \
            --D 128 --L 2 --df 512 --ctx 32 \
            --nq 4 --nkv 2 \
            --epochs 50000 \
            --lr 1e-3 --min-lr 1e-3 \
            --lr-schedule linear \
            --weight-decay 1.0 \
            --dropout 0.0 \
            --grad-accum 128 \
            --grad-clip 1.0 \
            --seed 42
