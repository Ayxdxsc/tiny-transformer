name: Build and Train (macOS ARM64)
on: [push, workflow_dispatch]

jobs:
  train:
    runs-on: macos-14  # 白嫖 Apple Silicon M1
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Generate Data
      run: python3 train.py
      
    - name: Compile Tiny (macOS ARM64 Native)
      run: |
        # Mac 原生 Clang 编译器，开启 NEON 和点乘加速
        clang++ -O3 -ffast-math -fno-math-errno -funroll-loops -fomit-frame-pointer -fno-exceptions -fno-rtti -o tiny tiny.cpp
        
    - name: Train
      run: |
        ./tiny --mode train --data-dir calc-data --sort-by name --data-exts .txt --model tiny.bin --ckpt model.ckpt --config tiny.cfg
        
    - name: Upload Model
      uses: actions/upload-artifact@v4
      with:
        name: calc-model-arm64
        path: |
          tiny.bin.best
          model.ckpt.best
